<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema · Material de clase</title>
<link rel="stylesheet" href="css/estilos.css">
<!-- Rutas relativas a propósito: el sitio se publica también en
     GitHub Pages bajo /asignaturas/, donde una ruta absoluta (/img/...)
     se saldría del subdirectorio y daría 404. -->
<link rel="icon" href="img/wifi.svg" type="image/svg+xml">
<link rel="icon" href="img/wifi-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="img/wifi-apple-touch-icon.png">
<script src="js/aspecto.js"></script>
</head>
<body>

<nav class="sidebar">
  <div class="selector-aspecto" id="selector-aspecto"></div>
  <div class="selector-idioma" id="selector-idioma" translate="no"></div>
  <h2 class="sidebar__titulo">Temario</h2>
  <div id="indice-temas"></div>
</nav>

<main class="main-content" id="tema-raiz">
  <a class="volver" href="index.html" id="tema-volver">&larr; Todas las unidades</a>

  <header class="card">
    <span class="badge" id="tema-unidad">Material de clase</span>
    <h1 id="tema-titulo">Cargando…</h1>
    <p id="tema-descripcion"></p>
    <!-- Selector de grupo (1r/2n). Solo aparece en las sesiones de
         Instalaciones; ver el comentario de index.html. -->
    <div class="selector-grupo" id="selector-grupo" hidden></div>
    <p class="badge badge--fecha" id="tema-fecha" hidden></p>
  </header>

  <section class="seccion" id="seccion-leccion" hidden>
    <div class="leccion" id="leccion-contenido"></div>
  </section>

  <section class="seccion" id="seccion-materiales">
    <h2 class="seccion__titulo">Materiales</h2>
    <ul class="materiales" id="lista-materiales"></ul>
  </section>

  <section class="seccion" id="seccion-actividades">
    <h2 class="seccion__titulo">Actividades</h2>
    <div id="lista-actividades"></div>
  </section>

  <footer class="pie">Material de clase</footer>
</main>

<aside class="indice" id="indice-pagina"></aside>

<script src="js/idioma.js"></script>
<script src="js/asignaturas.js"></script>
<script src="data/calendario-operaciones.js"></script>
<script src="data/calendario-instalaciones.js"></script>
<script src="js/calendario.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/generadores.js"></script>
<!-- Generadores por unidad. Van DESPUÉS de generadores.js porque se
     limitan a añadir entradas a su objeto GENERADORES; si falta alguno,
     las sesiones de esa unidad enseñan "No existe el generador". -->
<script src="js/generadores-riesgos.js"></script>
<script src="js/generadores-cobre.js"></script>
<script src="js/generadores-fibra.js"></script>
<script src="js/actividades.js"></script>
<script src="js/tema.js"></script>
</body>
</html>
