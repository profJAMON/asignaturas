<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material de clase</title>
<meta name="description" content="Apuntes y actividades de las asignaturas de informática.">
<link rel="stylesheet" href="css/estilos.css">
<!-- Rutas relativas a propósito: el sitio se publica también en
     GitHub Pages bajo /asignaturas/, donde una ruta absoluta (/img/...)
     se saldría del subdirectorio y daría 404. -->
<link rel="icon" href="img/wifi.svg" type="image/svg+xml">
<link rel="icon" href="img/wifi-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="img/wifi-apple-touch-icon.png">
<script src="js/aspecto.js"></script>
</head>
<body>

<nav class="sidebar">
  <div class="selector-aspecto" id="selector-aspecto"></div>
  <div class="selector-idioma" id="selector-idioma" translate="no"></div>
  <h2 class="sidebar__titulo">Temario</h2>
  <div id="indice-temas"></div>
</nav>

<main class="main-content">
  <a class="volver" href="index.html" id="portada-volver" hidden>&larr; Todas las asignaturas</a>

  <header class="card">
    <span class="badge" id="portada-badge">Material de clase</span>
    <h1 id="portada-titulo">Apuntes y Actividades</h1>
    <p id="portada-descripcion">Elige la asignatura con la que quieres trabajar.</p>
    <!-- Selector de grupo (1r/2n). Vive aquí, dentro de la asignatura,
         y no en la barra lateral, porque solo afecta a Instalaciones.
         js/calendario.js lo rellena y lo esconde en las demás. -->
    <div class="selector-grupo" id="selector-grupo" hidden></div>
    <a class="volver" href="calendario.html" id="portada-calendario" hidden style="margin: 0.8rem 0 0;">📅 Ver el calendario del curso</a>
  </header>

  <div id="indice-portada"></div>

  <footer class="pie">Material de clase</footer>
</main>

<script src="js/idioma.js"></script>
<script src="js/asignaturas.js"></script>
<script src="data/calendario-operaciones.js"></script>
<script src="data/calendario-instalaciones.js"></script>
<script src="js/calendario.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/main.js"></script>
</body>
</html>
