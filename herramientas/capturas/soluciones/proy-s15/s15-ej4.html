<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mini test</title>
</head>
<body>
    <h1>Mini test de cultura</h1>
    <form>
        <p>
            <label for="pregunta1">1. ¿Cuál es la capital de Francia?</label>
            <select id="pregunta1">
                <option>Roma</option>
                <option>París</option>
                <option>Berlín</option>
            </select>
        </p>
        <p>
            <label for="pregunta2">2. ¿Cuántas patas tiene una araña?</label>
            <select id="pregunta2">
                <option>6</option>
                <option>8</option>
                <option>10</option>
            </select>
        </p>
        <p>
            <label for="pregunta3">3. ¿Cuántos minutos tiene una hora?</label>
            <select id="pregunta3">
                <option>30</option>
                <option>60</option>
                <option>100</option>
            </select>
        </p>
        <button type="button" id="boton-corregir">Corregir</button>
    </form>
    <p id="resultado"></p>

    <script src="s15-ej4.js"></script>
</body>
</html>
