<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3</title>
</head>
<body>
    <h1>Encuesta del comedor</h1>
    <form>
        <p>
            <label for="plato">Tu plato favorito:</label>
            <select id="plato">
                <option>Macarrones</option>
                <option>Lentejas</option>
                <option>Pizza</option>
                <option>Pescado</option>
            </select>
        </p>
        <p>
            <label for="nota">Nota del comedor (del 1 al 10):</label>
            <input type="number" id="nota" min="1" max="10">
        </p>
        <p>
            <input type="checkbox" id="postre">
            <label for="postre">Quiero fruta de postre</label>
        </p>
        <p>
            <label for="idea">¿Qué cambiarías?</label><br>
            <textarea id="idea" rows="4" cols="40"></textarea>
        </p>
        <button type="button">Enviar opinión</button>
    </form>
</body>
</html>
