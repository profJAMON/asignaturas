<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Club de ajedrez</title>
</head>
<body>
    <header>
        <nav>
            <a href="s05-ej4.html">Inicio</a>
            <a href="s04-ej4.html">Cine de verano</a>
        </nav>
    </header>
    <main>
        <h1>Club de ajedrez</h1>
        <img src="img/ajedrez.png" alt="Dibujo de un tablero de ajedrez con piezas blancas y negras">
        <p>Aprende a jugar y apúntate a nuestro <strong>torneo de invierno</strong>.</p>
        <!-- Lo que hay que saber -->
        <h2>Qué necesitas saber</h2>
        <ul>
            <li>Cómo se mueve cada pieza</li>
            <li>Qué es el jaque mate</li>
        </ul>
        <!-- Horario -->
        <h2>Horario</h2>
        <table border="1">
            <tr>
                <th>Día</th>
                <th>Nivel</th>
            </tr>
            <tr>
                <td>Lunes</td>
                <td>Principiante</td>
            </tr>
            <tr>
                <td>Jueves</td>
                <td>Avanzado</td>
            </tr>
        </table>
        <!-- Formulario -->
        <h2>Inscripción al torneo</h2>
        <form>
            <p>
                <label for="alias">Tu alias:</label>
                <input type="text" id="alias">
            </p>
            <p>
                <label for="nivel">Tu nivel:</label>
                <select id="nivel">
                    <option>Principiante</option>
                    <option>Avanzado</option>
                </select>
            </p>
            <button type="button">Apuntarme</button>
        </form>
        <p>Reglas del ajedrez: <a href="https://es.wikipedia.org/wiki/Ajedrez" target="_blank">Wikipedia</a></p>
    </main>
</body>
</html>
