<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
</head>
<body>
    <h1>Preparar un bocadillo</h1>
    <h2>Qué necesitas</h2>
    <ul>
        <li>Pan</li>
        <li>Tomate</li>
        <li>Queso</li>
        <li>Aceite</li>
    </ul>
    <h2>Pasos</h2>
    <ol>
        <li>Corta el pan por la mitad.</li>
        <li>Frota el tomate por el pan.</li>
        <li>Echa un poco de aceite.</li>
        <li>Pon el queso y cierra el bocadillo.</li>
    </ol>
</body>
</html>
